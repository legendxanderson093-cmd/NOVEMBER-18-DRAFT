<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
content="width=device-width, initial-scale=1.0">

    <title>A Little Something for you ♡ </title>

    <!--Connect our CSS-->
    <link rel="stylesheet" href="style.css">
</head>

<body> 
    <main class="website">
        
        <section id = "welcome">
            <p class="subtitle">A LITTLE SOMETHING FOR YOU</p>

            <h1> Hey, Ate Naph.</h1>

            <p class="intro">
                Let's say... I may or may not have something to tell you?
            </p>

            <button id="openLetter"
          class="envelope-button"
          type="button"
          aria-expanded="false"
          aria-label="Open the letter">
              <div class="envelope" id="envelope">

                <div class="letter"></div>

                <div class="envelope-back"></div>

                <div class="envelope-flap"></div>

                <div class="envelope-heart">❤</div>

                <div class="final-letter" id="finalLetter">

                    <h2> To you, Naph</h2>

                    <p>
                        Hey so uh..
                    </p>

                    <P>
                        I guess I've been wanting to tell you this.. I've enjoyed our time together..
                    </P>

                    <p>
                        I know you've been courting me and I've thought about it
                    </p>

                    <p>
                        a lot, actually. 
                    </p>

                    <p> 
                        Honestly, I thought hard about this decision. Although I know that I did have feelings for you when we spent more time together, even when we play together or just talk
                    </p>

                    <p> 
                        Actually, I was tempted to say yes when you asked me when you first confessed. But I didn't want to seem like the type of person to rush (although I feel like im rushing rn actually) 
                    </p>

                    <p>
                        I really really really like you. You're sweet, kind, You tease me a lot, You remind me of your affection every chance you get as well as make me feel worth loving. 
                    </p>

                    <p> |
                        I learned how to code even complex stuff just to give you this "letter". To me, Being able to understand something you specifically study is something I can fully return after giving me all of your love, I want to show you that I am indeed worthy of the love and affection you give me
                    </p>

                    <p> 
                        so.. in other words...
                    </p>

                    <p>
                        yeah. I want to be yours. So take care of me, okay? HAHAHAH
                    </p>

                    <p>
                        I love you, Naph.
                    </p>

                <button id="exploreStars">
                    Explore the Stars
                </button>
                </div>

             </button>

             <p class="instruction" id="instruction">
                 Click the envelope :)
             </p>

             <p class="hidden-message"
            id="hiddenMessage">
               You found it! HAHAHA
             <br>
              Keep going, There's more
            </p>

        </div>

        <!--STAR MESSAGE ROOM-->

        <div class="star-room" id="starRoom">

            <h2> A little universe just for you (I felt like making this) </h2>

            <p> pick a star, Trust me </p>

            <div class="star-container">

                <button class="star" data-message = "I know I said this a lot, But I love you">
                    ★
                </button>
               
                <button class="star"
            data-message="I love playing with you">
                    ✦
                </button>
                
                <button class="star" data-message="You make me feel worth loving">
                    ✶
                </button>

                <button class="star" data-message="I love teasing you a lot">
                    ☆
                </button>

            
        </div>

        <p id="starMessage"
    class="star-message">
       Choose a Star! 
        </p>

         </section>
    </main>

    <!--Connect our Javascript-->
    <script src="script.js"></script>

</body>
</html>
